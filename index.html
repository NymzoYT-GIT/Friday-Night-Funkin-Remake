
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17132c">
  <title>Friday Night Funkin' Remake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <span class="logo">FNF!</span>
      <span class="subtitle">FRIDAY NIGHT FUNKIN' REMIX</span>
    </header>

    <section class="menu" id="menu">
      <p class="eyebrow">READY TO ROCK?</p>
      <h1>FRIDAY NIGHT<br><span>FUNKIN'</span></h1>
      <p class="description">Hit the notes. Keep the beat.</p>
      <button id="play">START GAME</button>
      <p class="hint">Use ← ↓ ↑ → to hit the notes</p>
    </section>

    <section class="game hidden" id="game">
      <div class="stats">
        <span> SCORE <strong id="score">0</strong></span>
        <span> COMBO <strong id="combo">0</strong></span>
        <span> ACCURACY <strong id="accuracy">100%</strong></span>
      </div>
      <div class="stage">
        <div class="character">♪</div>
        <div class="lanes" id="lanes">
          <div class="receptors">
            <span>←</span><span>↓</span><span>↑</span><span>→</span>
          </div>
          <div id="notes"></div>
        </div>
        <div id="judgment">READY?</div>
      </div>
      <div class="progress"><div id="progressFill"></div></div>
      <button id="back">BACK TO MENU</button>
    </section>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
